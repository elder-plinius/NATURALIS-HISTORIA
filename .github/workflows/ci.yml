name: Verify edition

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run deploy:dry-run
      - run: npm run deploy:preview:dry-run
      - run: npm run deploy:workers-builds:dry-run
      - run: npm run deploy:workers-builds-preview:dry-run
      - run: npm audit --audit-level=high
